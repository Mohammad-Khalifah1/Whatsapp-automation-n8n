# WhatsApp Support Routing — local development stack
#
# Design decisions (see docs/DECISIONS.md for full rationale):
#   - Docker Compose, not Kubernetes, for the MVP (single host, low complexity).
#   - n8n image pinned to the version already running on this machine (2.38.5)
#     rather than `:latest`, so `docker compose up` is reproducible.
#   - n8n's built-in user management (owner login) protects the editor UI;
#     no separate basic-auth layer is added for local dev. Production adds a
#     reverse proxy + TLS in front of this (see docs/DEPLOYMENT_HOSTINGER.md).
#   - All secrets come from .env (git-ignored). .env.example documents every
#     variable with a placeholder, never a real value.
#
# Usage:
#   cp .env.example .env   # then fill in real values as you obtain them
#   docker compose up -d
#   docker compose logs -f n8n

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.38.5
    container_name: n8n-whatsapp
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      # --- Timezone (all timestamps/cron schedules use this) ---
      - TZ=${TZ:-Asia/Amman}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Amman}

      # --- Editor / webhook URL generation ---
      # N8N_HOST/PROTOCOL/PORT control what n8n *thinks* its own address is,
      # used when it prints webhook URLs in the UI. WEBHOOK_URL overrides
      # the externally-visible base URL — set this to your ngrok/Cloudflare
      # Tunnel URL during development so the "Production URL" shown in the
      # Webhook node is actually reachable by Meta. See docs/SETUP.md.
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      # n8n 2.x renamed WEBHOOK_URL -> N8N_WEBHOOK_URL (the old name still
      # works but logs a deprecation warning on every boot).
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}

      # --- Encryption key for credentials stored in n8n's DB ---
      # MUST be set explicitly (not left to auto-generate) so the volume can
      # be backed up/restored or migrated to a VPS without losing the ability
      # to decrypt stored credentials. Generated once, stored only in .env.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # Code nodes need Node's built-in `crypto` for HMAC signature
      # verification (X-Hub-Signature-256). Scoped to that ONE module rather
      # than '*' — least privilege. NODE_FUNCTION_ALLOW_EXTERNAL is
      # deliberately NOT set: no npm packages may be loaded inside Code nodes.
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto

      # n8n 2.x blocks $env access inside nodes by DEFAULT. The workflows read
      # configuration (verify token, app secret, Graph API version, sheet id)
      # from the environment rather than hard-coding it, so this must be off.
      #
      # Security note: this grants Code nodes read access to this container's
      # environment. That is acceptable because the container's environment is
      # exactly the config the workflows are meant to use, and nothing else
      # runs in it. It is ALSO why nothing may be logged unredacted — see
      # scripts/lib/security.js redact().
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false

      # NOTE: N8N_RUNNERS_ENABLED is deliberately NOT set. n8n 2.x always uses
      # task runners and logs "no longer needed" if the variable is present.

      # --- Reduce noise / telemetry for a project handling customer data ---
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false

      # --- Defaults pinned explicitly ---
      # n8n warns that these defaults will tighten in a future release. Pinning
      # them means an n8n upgrade cannot silently change this system's
      # behaviour. The values chosen are the SAFER future defaults, not the
      # current permissive ones.
      #
      # No community packages: this project only uses built-in nodes, and
      # allowing unverified packages widens the supply-chain surface.
      - N8N_UNVERIFIED_PACKAGES_ENABLED=false
      # Every workflow here finishes in seconds; a 60s cap turns a hung Code
      # node into a fast, visible failure instead of a 5-minute stall.
      - N8N_RUNNERS_TASK_TIMEOUT=60
      # This system never processes archives. Small caps limit zip-bomb impact.
      - N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES=268435456
      - N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES=1000

      # --- Application-level configuration consumed by workflow Code/Set
      #     nodes (business logic), not by n8n itself. Documented in
      #     docs/ENVIRONMENT.md. ---
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v26.0}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID}
      - META_WABA_ID=${META_WABA_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - WEBHOOK_VERIFY_TOKEN=${WEBHOOK_VERIFY_TOKEN}
      - ALLOW_UNSIGNED_WEBHOOKS=${ALLOW_UNSIGNED_WEBHOOKS:-false}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - CONVERSATION_INACTIVITY_HOURS=${CONVERSATION_INACTIVITY_HOURS:-24}
      - DEFAULT_COUNTRY_CODE=${DEFAULT_COUNTRY_CODE:-962}
      - ASSIGNMENT_STRATEGY=${ASSIGNMENT_STRATEGY:-LEAST_OPEN_CONVERSATIONS}
      - REOPEN_CLOSED_CONVERSATIONS=${REOPEN_CLOSED_CONVERSATIONS:-true}
      - ARCHIVE_AFTER_DAYS=${ARCHIVE_AFTER_DAYS:-30}
      - ARCHIVE_BATCH_SIZE=${ARCHIVE_BATCH_SIZE:-200}

      # --- WAHA connector (optional second WhatsApp path, see
      #     docs/WAHA_CONNECTOR.md) — unset WAHA_API_KEY/HMAC leaves the
      #     Meta Cloud API path above fully unaffected. ---
      - WHATSAPP_CONNECTOR=${WHATSAPP_CONNECTOR:-meta}
      - WAHA_BASE_URL=${WAHA_BASE_URL:-http://waha:3000}
      # A session key that can only SEND on WAHA_SESSION — minted by
      # scripts/setup/configure-waha.js. n8n deliberately does NOT get the
      # admin WAHA_API_KEY: a compromised n8n could then send, but not read
      # history, log the number out, or create sessions.
      - WAHA_SEND_API_KEY=${WAHA_SEND_API_KEY}
      - WAHA_HMAC_SECRET=${WAHA_HMAC_SECRET}
      - WAHA_SESSION=${WAHA_SESSION:-default}

      # --- Workflow 4 (POST /webhook/agent/send) ---
      # Every request must carry a matching X-Agent-Key header. Unset = every
      # request rejected with 500 (fails closed). Without it, anyone who could
      # reach n8n could send any text to any number from the business number.
      - AGENT_SEND_API_KEY=${AGENT_SEND_API_KEY}

      # --- Management API (employees + tasks, workflows 9/10) ---
      - MANAGEMENT_API_KEY=${MANAGEMENT_API_KEY}

    volumes:
      # Named volume: n8n's own DB (SQLite), credentials, binary data, logs.
      # Survives `docker compose down` (only removed with an explicit -v).
      - n8n_data:/home/node/.n8n
      # Bind-mounted so workflow JSON/fixtures edited on the host can be
      # imported via the n8n CLI without rebuilding the image.
      - ./n8n/workflows:/home/node/n8n-workflows:ro
      - ./n8n/fixtures:/home/node/n8n-fixtures:ro

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - n8n_whatsapp_network

  # WAHA — QR-code WhatsApp connector. Optional: only used when
  # WHATSAPP_CONNECTOR=waha (see docs/WAHA_CONNECTOR.md). Scan the QR from
  # http://localhost:3000/dashboard (X-Api-Key: your WAHA_API_KEY) with the
  # WhatsApp already on your phone — it links like WhatsApp Web, no account
  # deletion. NOWEB engine: no Chromium, much lighter than WEBJS.
  #
  # Every setting below that departs from WAHA's defaults follows the official
  # docs; docs/WAHA_REFERENCE.md has the source for each.
  waha:
    # The NOWEB image (no browser), pinned. `latest` is the Chromium image —
    # 300 MB of browser this engine never starts — and floats between
    # releases. To update: change the version here, then
    # `docker compose pull waha && docker compose up -d waha`.
    image: devlikeapro/waha:noweb-2026.8.2
    container_name: waha-whatsapp
    restart: unless-stopped

    ports:
      # Localhost only, as in WAHA's own compose template. The API key is the
      # only thing between this port and full control of the linked number,
      # and n8n reaches WAHA over the Docker network, not this port.
      - "127.0.0.1:3000:3000"

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

    environment:
      - WHATSAPP_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      # Points at workflow 01b inside the n8n container, same Docker network —
      # "waha" and "n8n" resolve to each other by service name.
      - WHATSAPP_HOOK_URL=http://n8n:5678/webhook/whatsapp/waha-incoming
      # `message` = incoming only. NOT `message.any`: on a personal number
      # that would also forward everything the owner types to friends and
      # family. See docs/WAHA_REFERENCE.md §5.2.
      - WHATSAPP_HOOK_EVENTS=message
      - WHATSAPP_HOOK_HMAC_KEY=${WAHA_HMAC_SECRET}
      # Drop statuses, groups, channels and broadcast lists at the source —
      # no webhook, nothing stored. Applies to every session that does not
      # set its own config.ignore. Sending is not affected.
      - WAHA_SESSION_CONFIG_IGNORE_STATUS=True
      - WAHA_SESSION_CONFIG_IGNORE_GROUPS=True
      - WAHA_SESSION_CONFIG_IGNORE_CHANNELS=True
      - WAHA_SESSION_CONFIG_IGNORE_BROADCAST=True
      # Workflow 1b does not process media yet. Not downloading it keeps
      # customers' photos and voice notes out of the container; the message
      # still arrives with hasMedia/mimetype/filename.
      - WAHA_EVENTS_DOWNLOAD_MEDIA=False
      # The QR is served by the Dashboard; printing it into `docker logs`
      # only spreads it further.
      - WAHA_PRINT_QR=False
      # Pinned rather than left to auto-generate: WAHA prints a fresh random
      # dashboard/swagger password on every restart otherwise, which is
      # useless for coming back to scan a QR after a `docker compose down`.
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WHATSAPP_SWAGGER_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WHATSAPP_SWAGGER_PASSWORD=${WAHA_DASHBOARD_PASSWORD}

    volumes:
      # WhatsApp Web session data. Losing this means re-scanning the QR.
      - waha_sessions:/app/.sessions

    healthcheck:
      # /health requires the API key like every other route here — an
      # unauthenticated healthcheck gets 401 and never turns "healthy".
      # Node, not wget: the NOWEB image ships no wget. The key is read from
      # the container's own environment, so it no longer appears in the
      # healthcheck command that `docker inspect` shows.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health',{headers:{'X-Api-Key':process.env.WHATSAPP_API_KEY}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - n8n_whatsapp_network

  # Management UI — a to-do board + team screen over workflows 9/10
  # (ui/management/README.md). Static files only: nginx just serves them,
  # nothing runs server-side here. The page itself talks straight to the n8n
  # container below (which already answers CORS preflight on those routes),
  # so this service exists purely so "docker compose up" is enough to reach
  # it at http://localhost:8080 — no separate manual static-server step.
  management-ui:
    image: nginx:alpine
    container_name: management-ui
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./ui/management:/usr/share/nginx/html:ro

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/index.html"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - n8n_whatsapp_network

networks:
  n8n_whatsapp_network:
    name: n8n_whatsapp_network

volumes:
  waha_sessions:
    name: n8n_whatsapp_waha_sessions
  # NOTE: a fresh volume is used deliberately.
  #
  # The original volume (`n8n-whatsapp_n8n_data`) was created by an earlier run
  # in which n8n auto-generated its own encryption key and stored it inside the
  # volume. n8n refuses to start when that stored key disagrees with an explicit
  # N8N_ENCRYPTION_KEY env var ("Mismatching encryption keys").
  #
  # That old volume contained ZERO workflows and ZERO credentials, so nothing of
  # value is in it. It is intentionally left ON DISK, untouched, rather than
  # deleted. Remove it yourself once you are satisfied nothing is needed:
  #     docker volume rm n8n-whatsapp_n8n_data
  n8n_data:
    name: n8n_whatsapp_data
